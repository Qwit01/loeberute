<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Løberute-generator</title>
<meta name="theme-color" content="#1a73e8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    line-height: 1.4;
  }
  button {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 1.05rem;
    border: none;
    border-radius: 8px;
    background: #1a73e8;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #aaa; }
  #maps-btn { background: #188038; margin-top: 8px; }
  #status { margin-top: 12px; font-size: 0.9rem; color: #555; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input[type="number"] {
    width: 100%;
    padding: 12px;
    font-size: 1.05rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
  }
  #map {
    height: 320px;
    margin-top: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>
  <h1>Løberute-generator</h1>
  <label for="km-input">Ønsket distance (km)</label>
  <input type="number" id="km-input" min="1" max="42" step="0.5" value="5" />
  <button id="run-btn">Beregn rute</button>
  <p id="status"></p>
  <div id="map"></div>
  <button id="maps-btn" disabled>Åbn i Google Maps</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
