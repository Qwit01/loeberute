<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Løberute-generator — trin 5 geolocation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    line-height: 1.4;
  }
  button {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 1.05rem;
    border: none;
    border-radius: 8px;
    background: #1a73e8;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #aaa; }
  #status { margin-top: 12px; font-size: 0.9rem; color: #555; }
  #map {
    height: 320px;
    margin-top: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>
  <h1>Trin 5: geolocation</h1>
  <p>Henter din rigtige lokation via browserens geolocation, genererer en 5 km-rute derfra, og viser den på kortet.</p>
  <button id="run-btn">Find min lokation og generér rute</button>
  <p id="status"></p>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
